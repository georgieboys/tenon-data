# Nutrient catalogue.
# Ingredient nutrition keys must come from this list.
# reference_intakes are per day for adults. null means not yet sourced or no reference exists.
# carbohydrate_g is total carbohydrate, including sugars and fibre (see docs/nutrition-methodology.md).
#
# Singapore HPB values use a single adult reference cohort so % RI can be shown beside US FDA:
# adult men 18–<30 yrs (or 19–50 for calcium) from HealthHub RDA tables, plus HealthHub dietary
# guidance figures for energy, fibre and sodium where the RDA tables do not publish a single figure.
# Sex-specific differences (e.g. iron for women of reproductive age) are noted in nutrition-methodology.md.

reference_sources:
  us_fda: "US FDA Daily Values for adults and children 4 years and older, 21 CFR 101.9(c)"
  sg_hpb: "Singapore Health Promotion Board / HealthHub Recommended Dietary Allowances and dietary guidance; adult men 18–<30 yrs (calcium: adults 19–50 yrs) unless noted"

nutrients:
  - key: energy_kcal
    name: Energy
    unit: kcal
    group: energy
    reference_intakes: { us_fda: 2000, sg_hpb: 2200 }

  - key: protein_g
    name: Protein
    unit: g
    group: macro
    lever: protein
    # WHO/FAO energy & protein (TRS 724) at HPB adult-men reference weight 63.5 kg, NPU 70% ≈ 62 g/day
    reference_intakes: { us_fda: 50, sg_hpb: 62 }

  - key: fat_g
    name: Total fat
    unit: g
    group: macro
    # HPB dietary guidance: total fat ~30–35% of energy; 30% of 2200 kcal ≈ 73 g
    reference_intakes: { us_fda: 78, sg_hpb: 73 }

  - key: saturated_fat_g
    name: Saturated fat
    unit: g
    group: macro
    # HPB: less than 10% of energy from saturated fat; 10% of 2200 kcal ≈ 24 g
    reference_intakes: { us_fda: 20, sg_hpb: 24 }

  - key: carbohydrate_g
    name: Total carbohydrate
    unit: g
    group: macro
    # No single HPB RDA for total carbohydrate; left null rather than inventing one
    reference_intakes: { us_fda: 275, sg_hpb: null }

  - key: sugars_g
    name: Total sugars
    unit: g
    group: macro
    reference_intakes: { us_fda: null, sg_hpb: null }

  - key: fibre_g
    name: Dietary fibre
    unit: g
    group: macro
    lever: fibre
    # HealthHub / HPB dietary guidance: 26 g/day for men, 20 g/day for women
    reference_intakes: { us_fda: 28, sg_hpb: 26 }

  - key: sodium_mg
    name: Sodium
    unit: mg
    group: micro
    # HealthHub: no more than 2000 mg sodium/day (≈ 5 g salt)
    reference_intakes: { us_fda: 2300, sg_hpb: 2000 }

  - key: calcium_mg
    name: Calcium
    unit: mg
    group: micro
    lever: micronutrient
    # HealthHub RDA: adults 19–50 years 800 mg; 51+ is 1000 mg
    reference_intakes: { us_fda: 1300, sg_hpb: 800 }

  - key: iron_mg
    name: Iron
    unit: mg
    group: micro
    lever: micronutrient
    # HealthHub RDA: men 8 mg; women 18–<60 yrs 18 mg (see methodology)
    reference_intakes: { us_fda: 18, sg_hpb: 8 }

  - key: magnesium_mg
    name: Magnesium
    unit: mg
    group: micro
    lever: micronutrient
    reference_intakes: { us_fda: 420, sg_hpb: null }

  - key: potassium_mg
    name: Potassium
    unit: mg
    group: micro
    lever: micronutrient
    reference_intakes: { us_fda: 4700, sg_hpb: null }

  - key: zinc_mg
    name: Zinc
    unit: mg
    group: micro
    lever: micronutrient
    reference_intakes: { us_fda: 11, sg_hpb: null }

  - key: vitamin_a_ug
    name: Vitamin A, RAE
    unit: ug
    group: micro
    lever: micronutrient
    reference_intakes: { us_fda: 900, sg_hpb: 750 }

  - key: vitamin_c_mg
    name: Vitamin C
    unit: mg
    group: micro
    lever: micronutrient
    # HealthHub: ascorbic acid, men 19–50 yrs 105 mg
    reference_intakes: { us_fda: 90, sg_hpb: 105 }

  - key: vitamin_d_ug
    name: Vitamin D
    unit: ug
    group: micro
    lever: micronutrient
    # HealthHub: 2.5 µg for Singapore adults (tropical sunlight exposure)
    reference_intakes: { us_fda: 20, sg_hpb: 2.5 }

  - key: vitamin_k_ug
    name: Vitamin K
    unit: ug
    group: micro
    lever: micronutrient
    reference_intakes: { us_fda: 120, sg_hpb: null }

  - key: vitamin_b12_ug
    name: Vitamin B12
    unit: ug
    group: micro
    lever: micronutrient
    reference_intakes: { us_fda: 2.4, sg_hpb: 2.4 }

  - key: folate_ug
    name: Folate, DFE
    unit: ug
    group: micro
    lever: micronutrient
    # HealthHub lists folic acid 400 µg for adults 19–50
    reference_intakes: { us_fda: 400, sg_hpb: 400 }

  - key: caffeine_mg
    name: Caffeine
    unit: mg
    group: other
    reference_intakes: { us_fda: null, sg_hpb: null }
