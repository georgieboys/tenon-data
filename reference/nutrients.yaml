# Nutrient catalogue.
# Ingredient nutrition keys must come from this list.
# reference_intakes are per day for adults. null means not yet sourced or no reference exists.
# carbohydrate_g is total carbohydrate, including sugars and fibre (see docs/nutrition-methodology.md).

reference_sources:
  us_fda: "US FDA Daily Values for adults and children 4 years and older, 21 CFR 101.9(c)"
  sg_hpb: "Singapore Health Promotion Board Recommended Dietary Allowances (values not yet entered)"

nutrients:
  - key: energy_kcal
    name: Energy
    unit: kcal
    group: energy
    reference_intakes: { us_fda: 2000, sg_hpb: null }

  - key: protein_g
    name: Protein
    unit: g
    group: macro
    lever: protein
    reference_intakes: { us_fda: 50, sg_hpb: null }

