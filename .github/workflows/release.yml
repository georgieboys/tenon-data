name: Release data

# On every data tag (v0.3.410, …):
#   1. compile and validate the catalogue
#   2. publish bulk downloads (CSV, NDJSON, JSON, llms-full.txt) as release files
#   3. load the site database (Turso) with one atomic swap
#   4. trigger a tenon.coffee rebuild so list pages pick up the new version
# The full catalogue is only ever processed here, never on Vercel.

on:
  push:
    tags: ["v*"]
  # Manual run: publishes the selected branch under its package.json version
  # (creating that release, and the tag if missing). Use it to bootstrap or
  # to reload the database without a new data version.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-data
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve release tag
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::package.json is $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "TAG=$version" >> "$GITHUB_ENV"

      - name: Write exports
        run: node src/cli.ts export exports

      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" exports/* --clobber
          else
            gh release create "$TAG" exports/* --target "$GITHUB_SHA" --title "$TAG" --notes "Compiled exports for tenon-data $TAG. Licence: data CC BY-SA 4.0, code MIT."
          fi

      - name: Load site database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          if [ -z "$TURSO_DATABASE_URL" ]; then
            echo "::warning::TURSO_DATABASE_URL secret is not set; skipping database load"
            exit 0
          fi
          node src/cli.ts load-db

      - name: Rebuild tenon.coffee
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL secret is not set; skipping site rebuild"
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
